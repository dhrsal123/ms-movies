components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the JWT token issued by Keycloak to access Employee endpoints.

  responses:
    BadRequest:
      description: Bad Request. Occurs when validation fails or business rules are violated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "Invalid Request. Field validations failed."
            code: "CINEMA-001"
            status: "BAD_REQUEST"

    Unauthorized:
      description: Unauthorized. Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "Unauthorized."
            code: "CINEMA-005"
            status: "UNAUTHORIZED"

    Forbidden:
      description: Forbidden. Authenticated user lacks required authorities (e.g., HasEmployeeRole missing).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "Forbidden. Access Denied."
            code: "CINEMA-004"
            status: "FORBIDDEN"

    NotFound:
      description: Not Found. The requested entity does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          example:
            message: "The requested entity could not be found."
            code: "CINEMA-001"
            status: "NOT_FOUND"

    InternalServerError:
      description: Internal Server Error. Raised directly by generic Exceptions or Database transaction failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BaseErrorDto"
          examples:
            TechnicalError:
              summary: Custom DB/Technical Exception
              value:
                message: "DB error during operation"
                code: "CINEMA-002"
                status: "INTERNAL_SERVER_ERROR"

  schemas:
    BaseErrorDto:
      description: Standardized error payload handled by ExceptionHandlers and generated from CinemaExceptionTypes.
      type: object
      properties:
        message:
          type: string
          description: A specific message describing the nature of the error.
        code:
          type: string
          description: A predefined internal code string representing the type of error.
        status:
          type: string
          description: String representation of the Spring HttpStatus enum.
      required:
        - message
        - code
        - status

    MovieMediaRequestDto:
      type: object
      properties:
        mediaType:
          type: string
          enum:
            - TRAILER
            - TEASER
            - GALLERY_IMAGE
        movieId:
          type: string
          format: uuid
        mediaUrl:
          type: string
          maxLength: 1024
          minLength: 0
        title:
          type: string
          maxLength: 255
          minLength: 0
        displayOrder:
          type: integer
          format: int32
      required:
        - mediaType
        - mediaUrl
        - movieId
    MovieRequestDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 512
          minLength: 0
        releaseDate:
          type: string
          format: date
        posterUrl:
          type: string
          maxLength: 1024
          minLength: 0
        backdropUrl:
          type: string
          maxLength: 1024
          minLength: 0
        genreIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        actorIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        directorIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        media:
          type: array
          items:
            $ref: "#/components/schemas/MovieMediaRequestDto"
      required:
        - actorIds
        - description
        - directorIds
        - genreIds
        - releaseDate
        - title
    ActorResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        profilePictureUrl:
          type: string
    DirectorResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        birthDate:
          type: string
          format: date
        profilePictureUrl:
          type: string
    GenreResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
    MovieMediaResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mediaType:
          type: string
          enum:
            - TRAILER
            - TEASER
            - GALLERY_IMAGE
        mediaUrl:
          type: string
        title:
          type: string
        displayOrder:
          type: integer
          format: int32
    MovieResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        releaseDate:
          type: string
          format: date
        posterUrl:
          type: string
        backdropUrl:
          type: string
        genres:
          type: array
          items:
            $ref: "#/components/schemas/GenreResponseDto"
          uniqueItems: true
        actors:
          type: array
          items:
            $ref: "#/components/schemas/ActorResponseDto"
          uniqueItems: true
        directors:
          type: array
          items:
            $ref: "#/components/schemas/DirectorResponseDto"
          uniqueItems: true
        media:
          type: array
          items:
            $ref: "#/components/schemas/MovieMediaResponseDto"
    GenreRequestDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 512
          minLength: 0
        imageUrl:
          type: string
          maxLength: 1024
          minLength: 0
      required:
        - description
        - name
    DirectorRequestDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        birthDate:
          type: string
          format: date
        profilePictureUrl:
          type: string
          maxLength: 1024
          minLength: 0
      required:
        - birthDate
        - name
    ActorRequestDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        birthDate:
          type: string
          format: date
        profilePictureUrl:
          type: string
          maxLength: 1024
          minLength: 0
      required:
        - birthDate
        - name
openapi: 3.1.0
info:
  title: Cinema Movies Management API
  description: Microservice for managing cinema movies, more specifically movies information, actors, directors, and genres.
  version: 1.0.0
  contact:
    name: API Support
    email: support@cinema.io

servers:
  - url: http://localhost:8082
    description: Local Development Server


tags:
  - name: Movies
    description: Operations related to the movie catalog.
  - name: Genres
    description: Operations related to movie genres.
  - name: Directors
    description: Operations related to director management.
  - name: Actors
    description: Operations related to actor management.

paths:
  /api/v1/movies:
    get:
      tags:
        - Movies
      summary: Get all movies
      description: Retrieves a paginated list of all movies in the system.
      operationId: getAllMovies
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int32
            exclusiveMinimum: 0
      responses:
        "200":
          description: Successfully retrieved the list of movies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovieResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Movies
      summary: Create a new movie
      description: Creates a new movie entity. Requires Employee role.
      operationId: createMovie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieRequestDto"
      responses:
        "201":
          description: Movie created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/movies/{movieId}:
    get:
      tags:
        - Movies
      summary: Get movie details
      description: Retrieves the details of a specific movie by its UUID.
      operationId: getMovieById
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successfully retrieved movie details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Movies
      summary: Update a movie
      description: Updates the details of an existing movie. Requires Employee role.
      operationId: updateMovie
      security:
        - bearerAuth: []
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieRequestDto"
      responses:
        "200":
          description: Movie updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Movies
      summary: Delete a movie
      description: Deletes a movie from the system by its UUID. Requires Employee role.
      operationId: deleteMovie
      security:
        - bearerAuth: []
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Movie deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

